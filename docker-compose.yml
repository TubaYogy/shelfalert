# Production / Dockhand stack — image pulled from GHCR
services:
  app:
    image: ghcr.io/tubayogy/shelfalert:latest
    container_name: shelfalert
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3000"
    environment:
      DATABASE_URL: postgresql://shelfalert:${POSTGRES_PASSWORD:-shelfalert}@db:5432/shelfalert?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      NODE_ENV: production
      # Optional OIDC (Authelia / Authentik)
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    labels:
      # Watchtower auto-updates
      - "com.centurylinklabs.watchtower.enable=true"
      # Dockhand / Portainer friendly metadata
      - "dockhand.stack=shelfalert"
      - "org.opencontainers.image.title=ShelfAlert"
      - "org.opencontainers.image.description=Upcoming book release tracker"
    networks:
      - mediaserver_yogy

  db:
    image: postgres:17-alpine
    container_name: shelfalert_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: shelfalert
      POSTGRES_USER: shelfalert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shelfalert}
    volumes:
      - shelfalert_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelfalert -d shelfalert"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "dockhand.stack=shelfalert"
    networks:
      - mediaserver_yogy

volumes:
  shelfalert_db:
    name: shelfalert_db

networks:
  mediaserver_yogy:
    external: true
