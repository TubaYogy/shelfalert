# Development overrides — apply EXPLICITLY (NOT auto-merged by `docker compose`).
# This file is intentionally named docker-compose.dev.yml (not
# docker-compose.override.yml) so Docker Compose does NOT merge it automatically.
# Its bind mounts reference local source paths that do not exist on a NAS/Dockhand
# host, which would break production deploys if auto-merged.
# Runs the app with a bind-mount + hot reload instead of the production image.
# Usage (dev):   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# For prod-only: docker compose -f docker-compose.yml up -d

services:
  app:
    build:
      context: ./app
      target: builder
    command: sh -c "npx prisma db push --skip-generate --accept-data-loss && npm run dev"
    environment:
      NODE_ENV: development
    volumes:
      - ./app/src:/app/src
      - ./app/prisma:/app/prisma
      - ./app/server.ts:/app/server.ts
    # In dev we expose the internal port directly.
    ports:
      - "${PORT:-3001}:3000"
